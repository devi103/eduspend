<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduSpend — Sign In or Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; }
    .auth-card {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans flex items-center justify-center p-4 transition-colors duration-200">

  <div class="w-full max-w-md">
    
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/25 mb-4">
        <i data-lucide="wallet-cards" class="w-8 h-8"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight flex items-center justify-center gap-2">
        EduSpend
        <span class="text-xs font-semibold bg-brand-50 dark:bg-brand-950/70 text-brand-600 dark:text-brand-300 px-2 py-0.5 rounded-full border border-brand-200/50 dark:border-brand-800/50">EDU</span>
      </h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Smart Student Finance Tracker</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-slate-950/50 overflow-hidden">
      
      <!-- Tab Switcher -->
      <div class="flex border-b border-slate-100 dark:border-slate-800">
        <button id="loginTab" class="flex-1 py-3.5 text-sm font-bold transition-all bg-brand-600 text-white">
          Sign In
        </button>
        <button id="registerTab" class="flex-1 py-3.5 text-sm font-bold transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50">
          Create Account
        </button>
      </div>

      <!-- Error / Success Messages -->
      <div id="authError" class="hidden mx-6 mt-4 p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs font-semibold">
      </div>
      <div id="authSuccess" class="hidden mx-6 mt-4 p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-xs font-semibold">
      </div>

      <!-- Login Form -->
      <div id="loginFormContainer" class="p-6">
        <form id="loginForm" class="space-y-4">
          <div>
            <label for="loginEmail" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
              Email Address
            </label>
            <div class="relative">
              <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input type="email" id="loginEmail" required placeholder="you@university.edu"
                class="block w-full pl-10 pr-4 py-3 text-sm bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
            </div>
          </div>

          <div>
            <label for="loginPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
              Password
            </label>
            <div class="relative">
              <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input type="password" id="loginPassword" required placeholder="••••••••" minlength="6"
                class="block w-full pl-10 pr-4 py-3 text-sm bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
            </div>
          </div>

          <button type="submit" class="w-full py-3.5 px-6 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 transition-all flex items-center justify-center gap-2 active:scale-[0.99]">
            <i data-lucide="log-in" class="w-5 h-5"></i>
            Sign In
          </button>
        </form>
      </div>

      <!-- Register Form -->
      <div id="registerFormContainer" class="p-6 hidden">
        <form id="registerForm" class="space-y-4">
          <div>
            <label for="registerName" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
              Full Name <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input type="text" id="registerName" required placeholder="Your full name"
                class="block w-full pl-10 pr-4 py-3 text-sm bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
            </div>
          </div>

          <div>
            <label for="registerEmail" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
              Email Address <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input type="email" id="registerEmail" required placeholder="you@university.edu"
                class="block w-full pl-10 pr-4 py-3 text-sm bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
            </div>
          </div>

          <div>
            <label for="registerPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
              Password <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input type="password" id="registerPassword" required placeholder="Min 6 characters" minlength="6"
                class="block w-full pl-10 pr-4 py-3 text-sm bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
            </div>
          </div>

          <div>
            <label for="registerConfirmPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
              Confirm Password <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <i data-lucide="shield-check" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input type="password" id="registerConfirmPassword" required placeholder="Re-enter password" minlength="6"
                class="block w-full pl-10 pr-4 py-3 text-sm bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
            </div>
          </div>

          <button type="submit" class="w-full py-3.5 px-6 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 transition-all flex items-center justify-center gap-2 active:scale-[0.99]">
            <i data-lucide="user-plus" class="w-5 h-5"></i>
            Create Account
          </button>
        </form>
      </div>

      <!-- Footer -->
      <div class="px-6 pb-5 text-center">
        <p class="text-[11px] text-slate-400 dark:text-slate-500">
          Your data is encrypted and secured with Supabase Authentication.
        </p>
      </div>
    </div>

    <!-- Theme Toggle -->
    <div class="text-center mt-6">
      <button id="authThemeToggle" class="p-2 rounded-xl text-slate-500 hover:text-slate-700 hover:bg-white dark:text-slate-400 dark:hover:text-slate-200 dark:hover:bg-slate-800 transition-colors border border-slate-200 dark:border-slate-700" title="Toggle Light/Dark Theme">
        <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      </button>
    </div>
  </div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- EduSpend modules -->
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    // Theme toggle for auth page
    (function() {
      const saved = localStorage.getItem('eduspend_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
      
      const btn = document.getElementById('authThemeToggle');
      if (btn) {
        btn.addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('eduspend_theme', isDark ? 'dark' : 'light');
        });
      }

      if (window.lucide) window.lucide.createIcons();
    })();
  </script>
</body>
</html>
